name: CD — Automated Deployment to Vercel

on:
  push:
    branches:
      - main
      - master
      - staging
      - develop

concurrency:
  group: vercel-deploy-${{ github.ref }}
  cancel-in-progress: true

jobs:
  deploy-vercel:
    name: Deploy to Vercel (${{ (github.ref_name == 'main' || github.ref_name == 'master') && 'Production' || 'Preview / Staging' }})
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js 22 LTS
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install Dependencies & Verify Build
        run: |
          npm install --legacy-peer-deps --no-audit --no-fund
          npm run lint
          npm run build

      - name: Check Vercel CLI Secrets Mode
        id: check_secrets
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
        run: |
          if [ -n "$VERCEL_TOKEN" ] && [ -n "$VERCEL_ORG_ID" ] && [ -n "$VERCEL_PROJECT_ID" ]; then
            echo "has_vercel_secrets=true" >> "$GITHUB_OUTPUT"
          else
            echo "has_vercel_secrets=false" >> "$GITHUB_OUTPUT"
            echo "Info: VERCEL_TOKEN / VERCEL_ORG_ID / VERCEL_PROJECT_ID tidak diatur di GitHub Secrets. Deployment ditangani otomatis oleh integrasi GitHub-Vercel bawaan."
          fi

      - name: Deploy with Vercel CLI (If Secrets Configured)
        if: steps.check_secrets.outputs.has_vercel_secrets == 'true'
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
        run: |
          npm install --global vercel@latest
          if [ "${{ github.ref_name }}" = "main" ] || [ "${{ github.ref_name }}" = "master" ]; then
            vercel pull --yes --environment=production --token="$VERCEL_TOKEN"
            vercel build --prod --token="$VERCEL_TOKEN"
            vercel deploy --prebuilt --prod --token="$VERCEL_TOKEN"
          else
            vercel pull --yes --environment=preview --token="$VERCEL_TOKEN"
            vercel build --token="$VERCEL_TOKEN"
            vercel deploy --prebuilt --token="$VERCEL_TOKEN"
          fi
