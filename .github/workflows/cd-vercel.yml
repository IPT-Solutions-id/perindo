name: CD — Automated Deployment to Vercel

on:
  push:
    branches:
      - main
      - staging
      - develop
  pull_request:
    branches:
      - main
      - staging

concurrency:
  group: vercel-deploy-${{ github.ref }}
  cancel-in-progress: true

env:
  VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
  VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}

jobs:
  deploy-vercel:
    name: Deploy to Vercel (${{ github.ref_name == 'main' && 'Production' || 'Preview / Staging' }})
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js 20 LTS
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install Dependencies & Build
        run: |
          npm install --no-audit --no-fund
          npm run lint
          npm run build

      - name: Check Vercel CLI Secrets Mode
        id: check_secrets
        run: |
          if [ -n "${{ secrets.VERCEL_TOKEN }}" ] && [ -n "${{ secrets.VERCEL_ORG_ID }}" ] && [ -n "${{ secrets.VERCEL_PROJECT_ID }}" ]; then
            echo "has_vercel_secrets=true" >> $GITHUB_OUTPUT
          else
            echo "has_vercel_secrets=false" >> $GITHUB_OUTPUT
            echo "Notice: VERCEL_TOKEN / VERCEL_ORG_ID / VERCEL_PROJECT_ID belum diisi di GitHub Secrets. Jika Anda menghubungkan repositori langsung melalui Dashboard Vercel (Vercel GitHub Integration), Vercel akan otomatis melakukan deploy Preview & Production tanpa memerlukan token manual."
          fi

      - name: Install Vercel CLI
        if: steps.check_secrets.outputs.has_vercel_secrets == 'true'
        run: npm install --global vercel@latest

      - name: Pull Vercel Environment Information
        if: steps.check_secrets.outputs.has_vercel_secrets == 'true'
        run: |
          if [ "${{ github.ref }}" == "refs/heads/main" ] && [ "${{ github.event_name }}" == "push" ]; then
            vercel pull --yes --environment=production --token=${{ secrets.VERCEL_TOKEN }}
          else
            vercel pull --yes --environment=preview --token=${{ secrets.VERCEL_TOKEN }}
          fi

      - name: Build Project Artifacts with Vercel CLI
        if: steps.check_secrets.outputs.has_vercel_secrets == 'true'
        run: |
          if [ "${{ github.ref }}" == "refs/heads/main" ] && [ "${{ github.event_name }}" == "push" ]; then
            vercel build --prod --token=${{ secrets.VERCEL_TOKEN }}
          else
            vercel build --token=${{ secrets.VERCEL_TOKEN }}
          fi

      - name: Deploy to Vercel
        if: steps.check_secrets.outputs.has_vercel_secrets == 'true'
        run: |
          if [ "${{ github.ref }}" == "refs/heads/main" ] && [ "${{ github.event_name }}" == "push" ]; then
            vercel deploy --prebuilt --prod --token=${{ secrets.VERCEL_TOKEN }}
          else
            vercel deploy --prebuilt --token=${{ secrets.VERCEL_TOKEN }}
          fi
